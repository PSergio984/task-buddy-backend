name: Deploy production

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you deploying (ticket/change summary)?"
        required: true
      ref:
        description: "Git ref to deploy (default: main)"
        required: true
        default: main

jobs:
  gate:
    runs-on: ubuntu-24.04
    # GitHub Environments gate: configure required reviewers on the
    # 'production' environment (Repo → Settings → Environments) so this
    # job pauses for human approval before any deploy hook fires.
    environment:
      name: production
      url: https://task-buddy-backend-wy3w.onrender.com
    steps:
      - name: Record deploy intent
        env:
          DEPLOY_REF: ${{ inputs.ref }}
          DEPLOY_REASON: ${{ inputs.reason }}
        run: |
          echo "Deploying $DEPLOY_REF to production"
          echo "Reason: $DEPLOY_REASON"
          echo "Triggered by: ${{ github.actor }}"

      - name: Verify pre-deploy health
        run: |
          curl -fsS https://task-buddy-backend-wy3w.onrender.com/health \
            | tee health-before.json

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          DEPLOY_REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret not set — record intent only."
            echo "Create it in Render dashboard → service → Settings → Deploy Hook."
            exit 0
          fi
          # Deploy only what was approved: resolve the ref to a SHA and
          # require it to be the current head of main (the branch Render
          # actually deploys). A stale or non-main ref is recorded, not fired.
          SHA=$(gh api "repos/${{ github.repository }}/commits/$DEPLOY_REF" -q .sha)
          MAIN_SHA=$(gh api "repos/${{ github.repository }}/commits/main" -q .sha)
          if [ "$SHA" != "$MAIN_SHA" ]; then
            echo "::warning::$DEPLOY_REF resolves to $SHA but main is $MAIN_SHA."
            echo "Render deploys the linked branch — refusing to fire the hook for a mismatched ref."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"

      - name: Post-deploy health check
        run: |
          sleep 30
          for i in 1 2 3 4 5; do
            if curl -fsS https://task-buddy-backend-wy3w.onrender.com/health | grep -q '"ok"'; then
              echo "Post-deploy health OK (attempt $i)"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Post-deploy health check failed — consider rollback (docs/ops/DEPLOYMENT.md)"
          exit 1
