name: Python application

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  migrations:
    name: Migration Sanity Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Check alembic revision chain
        run: |
          python - <<'EOF'
          import re, sys
          from pathlib import Path

          versions = Path("alembic/versions")
          revs: dict[str, str | None] = {}
          for p in versions.glob("*.py"):
              if p.name.startswith("_"):
                  continue
              text = p.read_text()
              m = re.search(r"revision:\s*(?:str\s*=\s*)?['\"]([^'\"]+)['\"]", text)
              d = re.search(r"down_revision[^=]*=\s*(None|['\"][^'\"]+['\"])", text)
              if not m:
                  print(f"ERROR: no revision id found in {p.name}")
                  sys.exit(1)
              down = None
              if d and d.group(1) != "None":
                  down = d.group(1).strip("'\"")
              if m.group(1) in revs:
                  print(f"ERROR: duplicate revision id {m.group(1)}")
                  sys.exit(1)
              revs[m.group(1)] = down

          if not revs:
              print("ERROR: no alembic revisions found")
              sys.exit(1)

          children = {down for down in revs.values() if down is not None}
          heads = [r for r in revs if r not in children]
          if len(heads) != 1:
              print(f"ERROR: expected exactly 1 head revision, found {len(heads)}: {heads}")
              sys.exit(1)

          for r, down in revs.items():
              if down is not None and down not in revs:
                  print(f"ERROR: revision {r} references missing parent {down}")
                  sys.exit(1)

          print(f"OK: {len(revs)} revisions, single head {heads[0]}")
          EOF

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint with ruff
        run: |
          ruff check .
      - name: Check formatting with ruff
        run: |
          ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Typecheck with mypy
        run: |
          mypy app

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      SECRET_KEY: test-secret-key-for-ci-purposes-only
      MAIL_URL: "https://api.brevo.com/v3"
      MAIL_API_KEY: "ci-test-key"
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Test with pytest
        run: |
          pytest

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t task-buddy-backend:ci .
