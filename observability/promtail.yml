server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: task-buddy-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /task-buddy-.*
        target_label: container
      - source_labels: [__meta_docker_container_name]
        regex: /task-buddy-.*
        action: keep
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    pipeline_stages:
      - json:
          expressions:
            level: levelname
            trace_id: otelTraceID
            span_id: otelSpanID
            correlation_id: correlation_id
      - labels:
          level:
      - structured_metadata:
          trace_id:
          span_id:
          correlation_id:
